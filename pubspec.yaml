name: koti
description: "Koti — Your personal spending balance tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Database
  drift: ^2.22.1
  drift_flutter: ^0.2.0
  path_provider: ^2.1.5
  
  # Routing
  go_router: ^14.0.0
  
  # Data Modeling & Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  intl: ^0.19.0
  money2: ^6.3.0
  currency_text_input_formatter: ^2.2.3
  
  # Hardware & Native Features
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  
  # Storage & Security
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  
  # UI & Presentation
  fl_chart: ^1.2.0
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  simple_icons: ^16.23.0
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  currency_picker: ^2.0.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Gen
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/k_wallet.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0A0A"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/

flutter_native_splash:
  color: "#0A0A0A"
  image: "assets/icon/k_wallet.png"
  android: true
  ios: true
  android_12:
    color: "#0A0A0A"
    image: "assets/icon/k_wallet.png"
